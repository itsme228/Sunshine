---
name: usbridge Release

on:
  push:
    tags:
      - 'v*.usbridge'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2026.703.usbridge)'
        required: false

jobs:
  build-macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            artifact: Sunshine-macOS-arm64.dmg
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: sudo xcode-select --switch /Applications/Xcode_16.2.app

      - name: Install dependencies
        run: |
          brew install --quiet \
            cmake \
            node \
            pkgconf \
            icu4c@78 \
            miniupnpc \
            openssl@3 \
            opus

      - name: Configure
        run: |
          cmake \
            -B build \
            -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_DOCS=OFF \
            -DICU_ROOT="$(brew --prefix icu4c@78)" \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DOpus_ROOT_DIR="$(brew --prefix opus)" \
            -DSUNSHINE_ENABLE_TRAY=OFF \
            -DSUNSHINE_PUBLISHER_NAME="usbridge_agent" \
            -DSUNSHINE_PUBLISHER_WEBSITE="https://github.com/itsme228/usbridge_agent" \
            -DSUNSHINE_PUBLISHER_ISSUE_URL="https://github.com/itsme228/usbridge_agent/issues"

      - name: Build
        run: cmake --build build -j $(sysctl -n hw.ncpu)

      - name: Package DMG
        run: |
          cd build
          cpack -G DragNDrop --config CPackConfig.cmake
          mkdir -p ../artifacts
          cp cpack_artifacts/Sunshine.dmg "../artifacts/${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.artifact }}

  build-windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-nodejs
            mingw-w64-ucrt-x86_64-onevpl
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-toolchain

      - name: Configure
        shell: msys2 {0}
        run: |
          cmake \
            -B build \
            -S . \
            -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_DOCS=OFF \
            -DSUNSHINE_ENABLE_TRAY=OFF \
            -DSUNSHINE_PUBLISHER_NAME="usbridge_agent" \
            -DSUNSHINE_PUBLISHER_WEBSITE="https://github.com/itsme228/usbridge_agent" \
            -DSUNSHINE_PUBLISHER_ISSUE_URL="https://github.com/itsme228/usbridge_agent/issues"

      - name: Build
        shell: msys2 {0}
        run: cmake --build build -j $(nproc)

      - name: Package ZIP
        shell: msys2 {0}
        run: |
          cd build
          cpack -G ZIP --config CPackConfig.cmake
          mkdir -p ../artifacts
          cp cpack_artifacts/Sunshine.zip ../artifacts/Sunshine-Windows-x86_64-portable.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sunshine-Windows-x86_64-portable.zip
          path: artifacts/Sunshine-Windows-x86_64-portable.zip

  build-linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install cmake 4.x from Kitware
        run: |
          wget -qO - https://apt.kitware.com/keys/kitware-archive-latest.asc \
            | gpg --dearmor \
            | sudo tee /etc/apt/trusted.gpg.d/kitware.gpg >/dev/null
          sudo apt-add-repository -y \
            "deb https://apt.kitware.com/ubuntu/ $(lsb_release -cs) main"
          sudo apt-get update -qq
          sudo apt-get install -y cmake

      - name: Install build dependencies
        run: |
          sudo add-apt-repository universe -y
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-14 g++-14 pkg-config nodejs npm \
            libssl-dev libevdev-dev libopus-dev libpulse-dev \
            libcurl4-openssl-dev libgbm-dev libnuma-dev \
            libpipewire-0.3-dev libsystemd-dev libnotify-dev \
            libx11-dev libxrandr-dev libxfixes-dev libxtst-dev \
            libxcb-shm0-dev libxcb-xfixes0-dev libxcb1-dev \
            libdrm-dev libcap-dev libudev-dev libwayland-dev \
            libminiupnpc-dev libva-dev libvulkan-dev \
            qtbase5-dev libqt5svg5-dev glslang-tools

      # CUDA toolkit (compile-time only: nvcc + headers + static cudart). Without
      # it SUNSHINE_BUILD_CUDA is never defined and the Linux build silently
      # loses the CUDA/NVENC zero-copy path ("Attempting to use NVENC without
      # CUDA support. Reverting back to GPU -> RAM -> GPU"). 12.9 is the newest
      # 12.x: still builds sm_50+ kernels (13.x drops < sm_75) and supports
      # gcc-14 as host compiler. Nothing from the toolkit ships in the tarball;
      # libcuda.so comes from the host's NVIDIA driver at runtime.
      - name: Install CUDA toolkit
        env:
          CUDA_VERSION: "12.9.1"
          CUDA_BUILD: "575.57.08"
        run: |
          url="https://developer.download.nvidia.com/compute/cuda/${CUDA_VERSION}/local_installers/cuda_${CUDA_VERSION}_${CUDA_BUILD}_linux.run"
          wget -q --max-redirect=0 -O "$RUNNER_TEMP/cuda.run" "$url"
          sudo sh "$RUNNER_TEMP/cuda.run" --silent --toolkit --toolkitpath="$RUNNER_TEMP/cuda" \
            --no-opengl-libs --no-man-page --no-drm
          rm -f "$RUNNER_TEMP/cuda.run"
          "$RUNNER_TEMP/cuda/bin/nvcc" --version

      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_DOCS=OFF \
            -DSUNSHINE_BUILD_APPIMAGE=ON \
            -DSUNSHINE_ENABLE_CUDA=ON \
            -DCUDA_FAIL_ON_MISSING=ON \
            -DCMAKE_CUDA_COMPILER:PATH="$RUNNER_TEMP/cuda/bin/nvcc" \
            -DCMAKE_CUDA_HOST_COMPILER=g++-14 \
            -DSUNSHINE_ENABLE_TRAY=OFF \
            -DSUNSHINE_PUBLISHER_NAME="usbridge_agent" \
            -DSUNSHINE_PUBLISHER_WEBSITE="https://github.com/itsme228/usbridge_agent" \
            -DSUNSHINE_PUBLISHER_ISSUE_URL="https://github.com/itsme228/usbridge_agent/issues"

      - name: Build
        run: cmake --build build -j $(nproc)

      - name: Verify CUDA support was compiled in
        run: |
          grep -q "SUNSHINE_BUILD_CUDA" build/CMakeFiles/sunshine.dir/flags.make
          find build -name 'cuda.cu.o' | grep -q .
          echo "CUDA path compiled into sunshine"

      - name: Install to staging and package tarball
        run: |
          DESTDIR=staging cmake --install build --prefix /usr

          # Bundle every shared library the sunshine binary needs into
          # staging/usr/lib and patch its RPATH to $ORIGIN/../lib, so the
          # tarball is fully self-contained. usbridge_agent's Linux AppImage
          # build copies this staging tree as-is and relies on usr/lib
          # already carrying Sunshine's runtime deps (e.g.
          # libminiupnpc.so.17) — the host AppImage users run on has no
          # guarantee of matching system packages.
          curl -fL --progress-bar -o /tmp/linuxdeploy-x86_64.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          chmod +x /tmp/linuxdeploy-x86_64.AppImage

          # `cmake --install` installs a .desktop file with Icon=sunshine
          # (see packaging/linux/AppImage/*.desktop) that linuxdeploy
          # auto-detects and tries to deploy to the AppDir root — same as
          # upstream's own AppImage packaging in .github/workflows/ci-linux.yml,
          # which feeds linuxdeploy the matching icon/desktop file explicitly
          # instead of letting it guess. Do the same here.
          desktop_file="$(find staging/usr/share/applications -name '*.desktop' | head -1)"

          # GH-hosted runners don't reliably have a working FUSE mount for
          # AppImages to self-mount via; --appimage-extract-and-run makes the
          # AppImage runtime extract itself to a temp dir and exec from there
          # instead, sidestepping FUSE entirely.
          #
          # libva/libva-drm must NOT be bundled. linuxdeploy's built-in
          # excludelist already knows to leave libGL/libEGL/libdrm etc. on
          # the host because they have to match the host's own GPU driver
          # stack -- but it predates VAAPI being common and doesn't cover
          # libva. Bundling it anyway pulls in Ubuntu 22.04's ancient libva
          # (VA-API interface ~1.14), which can't resolve the
          # __vaDriverInit_1_2x symbol newer host VAAPI drivers export
          # (e.g. current intel-media-va-driver), so hardware encoding
          # silently falls back to software on every up-to-date host. libva
          # is loaded at runtime and is always present alongside a
          # functioning VAAPI stack, so excluding it just means we rely on
          # the host's copy, same as we already do for libGL/libdrm.
          ARCH=x86_64 /tmp/linuxdeploy-x86_64.AppImage \
            --appimage-extract-and-run \
            --appdir staging \
            --executable staging/usr/bin/sunshine \
            --icon-file sunshine.png \
            --desktop-file "$desktop_file" \
            --exclude-library="libva.so*" \
            --exclude-library="libva-drm.so*"

          missing_libs="$(ldd staging/usr/bin/sunshine 2>/dev/null | awk '/not found/ {print $1}')"
          if [[ -n "$missing_libs" ]]; then
            echo "::error::sunshine binary still missing shared libraries after bundling: $missing_libs"
            exit 1
          fi

          mkdir -p artifacts
          tar -czf artifacts/Sunshine-Linux-x86_64.tar.gz -C staging .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sunshine-Linux-x86_64.tar.gz
          path: artifacts/Sunshine-Linux-x86_64.tar.gz

  release:
    name: Create Release
    needs: [build-macos, build-windows, build-linux]
    # A plain workflow_dispatch on a branch (no tag input) is a CI-only test
    # build: don't turn the branch name into a release tag.
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Determine tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [[ -z "$TAG" ]]; then
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Sunshine ${{ steps.tag.outputs.tag }} (usbridge fork)"
          body: |
            Sunshine fork by usbridge with `web_bind_address` config option.

            Set `web_bind_address = 127.0.0.1` in sunshine.conf to restrict the
            admin HTTPS UI to localhost while streaming ports bind to your VPN
            interface via `bind_address`.
          files: |
            artifacts/Sunshine-macOS-arm64.dmg
            artifacts/Sunshine-Windows-x86_64-portable.zip
            artifacts/Sunshine-Linux-x86_64.tar.gz
          fail_on_unmatched_files: false
